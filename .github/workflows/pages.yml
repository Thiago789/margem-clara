name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Check public repository security
        run: node tools/security-check.js

      - name: Check static integrity
        run: node tools/static-check.js

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Check backend foundation
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/margem_clara_ci
          AUTH_LOOKUP_SECRET: ci-only-auth-lookup-secret-at-least-32-characters
        run: |
          pnpm prisma:validate
          pnpm prisma:generate
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Run manager journey smoke test
        run: node tools/smoke-test.js

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
